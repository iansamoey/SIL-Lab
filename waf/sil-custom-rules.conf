# SIL custom WAF rules, loaded before the OWASP Core Rule Set.
#
# Rule 10001: PHI identifiers must never travel in a URL query string.
# URLs end up in browser history, proxy logs and access logs, so a national ID
# in a query string is a data leak even when the request is otherwise legitimate.
# Clients must use POST /api/patients/search with the identifier in the body.
SecRule ARGS_GET_NAMES "@rx (?i)^(national_?id|id_?number|nhif|sha_?number|phone|msisdn)$" \
    "id:10001,phase:1,deny,status:403,log,\
    msg:'PHI identifier sent in URL query string',\
    tag:'sil/phi-in-url',severity:'CRITICAL'"

# Rule 10002: block framework docs/admin paths that should never be public.
SecRule REQUEST_FILENAME "@rx (?i)/(docs|redoc|openapi\.json|admin|actuator)(/|$)" \
    "id:10002,phase:1,deny,status:404,log,\
    msg:'Blocked internal path',tag:'sil/internal-path'"
